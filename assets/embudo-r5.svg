<title id="t">Embudo desmontable que sujeta el FEP: El Turro R5</title><desc id="d">Sección conceptual: cuello del embudo dentro de la lámina FEP, con mitades por fuera, reborde de apoyo y palito central. El FEP se asienta en su ranura de la base. Se retira el embudo antes de comprimir.</desc>
<rect width="1200" height="760" fill="#f5f7fa"/><g font-family="Arial,sans-serif" fill="#20334a">
<text x="45" y="50" font-size="16" fill="#155dc0">EL TURRO · R5 · SEXTA PIEZA</text><text x="45" y="93" font-size="32" font-weight="bold">El embudo sostiene el FEP abierto.</text><text x="45" y="126" font-size="18">Sección explicativa del llenado. El émbolo se utiliza después de retirar el embudo.</text>
<path d="M245 648V607H319V624H337V617H383V629H389V617H431V634H449V617H491V629H497V617H543V624H561V607H635V648Z" fill="#d7dfe8" stroke="#52647a" stroke-width="2"/>
<rect x="319" y="357" width="64" height="260" fill="#d7dfe8" stroke="#52647a"/><rect x="497" y="357" width="64" height="260" fill="#d7dfe8" stroke="#52647a"/>
<rect x="298" y="357" width="17" height="260" fill="#206adb" rx="3"/><rect x="565" y="357" width="17" height="260" fill="#206adb" rx="3"/>
