<text x="723" y="191" font-size="20" font-weight="bold">Boca ancha y redondeada</text><text x="723" y="218" font-size="16">Paso abierto alrededor del palito Ø2 mm.</text>
<text x="723" y="335" font-size="20" font-weight="bold">Reborde de apoyo</text><text x="723" y="360" font-size="16">Descansa en las mitades; limita la entrada.</text>
<text x="723" y="396" font-size="20" font-weight="bold">Cuello corto dentro del FEP</text><text x="723" y="421" font-size="16">La pared del molde lo sostiene por fuera.</text>
<text x="723" y="465" font-size="20" font-weight="bold">Lámina flexible FEP</text><text x="723" y="490" font-size="16">Naranja solo para identificarla en el corte.</text>
<text x="723" y="615" font-size="20" font-weight="bold">Ranura circular inferior</text><text x="723" y="640" font-size="16">Separada del alojamiento central del palito.</text>
<text x="43" y="278" font-size="17" font-weight="bold">06 · EMBUDO</text><text x="43" y="305" font-size="16">Desmontable</text><text x="43" y="335" font-size="16">Sin tapa central</text><text x="43" y="362" font-size="16">Sin roscas</text>
<path d="M45 681H1155" stroke="#c5d0dc"/><text x="45" y="711" font-size="17">6 piezas impresas + palito Ø2 mm + FEP · Émbolo Ø2.2 mm pasante, fuera durante el llenado.</text>
<text x="45" y="740" font-size="14" fill="#52647a">Geometría conceptual, sin escala. Ajustar cuello, solape y longitud del FEP con el material real antes de fabricar.</text></g></svg>
